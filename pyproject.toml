[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-coding-harness"
version = "0.1.0"
description = "Async coding-agent harness with provider routing, Docker sandboxes, and evaluation telemetry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2",
  "typer>=0.12.5",
  "rich>=13.8",
]

[project.optional-dependencies]
openai = ["openai>=1.55"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]
all = ["openai>=1.55", "anthropic>=0.40", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
agentic-harness = "agentic_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
