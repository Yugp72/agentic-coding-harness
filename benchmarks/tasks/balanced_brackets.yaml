id: balanced-brackets
title: Balanced brackets
prompt: |
  Implement `is_balanced(text: str) -> bool`. Ignore non-bracket characters.
  Parentheses (), square brackets [], and braces {} must be correctly nested.
language: python
entry_file: solution.py
test_file: test_solution.py
timeout_seconds: 5
tests: |
  from solution import is_balanced

  assert is_balanced("") is True
  assert is_balanced("abc") is True
  assert is_balanced("([]{})") is True
  assert is_balanced("([)]") is False
  assert is_balanced("(") is False
  assert is_balanced("a{b[c](d)e}f") is True
  print("PASS")
